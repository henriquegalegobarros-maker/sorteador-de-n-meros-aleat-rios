<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Sorteador de Número Aleatório</title>
</head>

<body>
    <main>
        <img class="imagen" src="./assets/sort 1.png" alt="imagem-logo">

        <h1>Sortear um número</h1>

        <div>
            <input class="input-insert-value" id="entre" placeholder="Entre" type="number">
            <input class="input-insert-value" id="e" placeholder="E" type="number">
            <input class="input-insert-value" id="total" placeholder="Total" type="number">
        </div>

        <button class="buttonSortear">Sortear</button>
    </main>

    <script src="./scripts.js"></script>
</body>

</html>
